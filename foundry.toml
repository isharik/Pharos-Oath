[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
atlantic = "${PHAROS_ATLANTIC_RPC_URL}"
pacific = "${PHAROS_PACIFIC_RPC_URL}"

[etherscan]
atlantic = { key = "${PHAROSSCAN_API_KEY}", url = "https://api.pharosscan.xyz/api" }
